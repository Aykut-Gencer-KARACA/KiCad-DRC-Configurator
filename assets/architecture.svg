<title id="t">Sistem mimarisi</title>
<desc id="d">KiCad projesi, kicad-cli ve JLCPCB servisleri uygulamaya girer. Uygulamanın kural motoru KiCad şablonunu yazar ve kicad-cli ile doğrular, proje güncelleme mevcut projeye kuralları yedek alarak uygular, üretim bölümü JLC_Production klasörüne Gerber, BOM, CPL, netlist ve xlsx yazar, PCB hesaplayıcıları sonuçları gösterir.</desc>
